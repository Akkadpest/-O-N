name: Deploy Akkad website to Lightsail

# Runs the server tests, then copies the akkad/ folder to the Lightsail server and restarts the site.
# Needs one repository secret: LIGHTSAIL_SSH_KEY (the contents of the Lightsail .pem key file).
# Optional secret: GOOGLE_MAPS_API_KEY (turns on the Google address search).
on:
  push:
    branches: [main, claude/wizardly-ride-hz4jv5]
    paths: ['akkad/**', '.github/workflows/deploy-akkad.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-akkad
  cancel-in-progress: false

env:
  DEPLOY_HOST: 13.212.142.149
  SSH_USER: ubuntu
  # Your own domain once its DNS points at the server (for example pestcontrol.ae).
  # Empty = a free test address made from the server's IP, so https (and location) can work without a domain.
  SITE_DOMAIN: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        working-directory: akkad
        run: npm test
      - name: Prepare SSH
        env:
          KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::Add the repository secret LIGHTSAIL_SSH_KEY (Settings > Secrets and variables > Actions)."; exit 1; fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/lightsail.pem
          chmod 600 ~/.ssh/lightsail.pem
          ssh-keyscan -T 10 "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Upload and install
        env:
          GOOGLE_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          SSH="ssh -i $HOME/.ssh/lightsail.pem -o BatchMode=yes -o ConnectTimeout=20 $SSH_USER@$DEPLOY_HOST"
          tar -C akkad --exclude=./node_modules --exclude=./data/db.json --exclude=./data/uploads --exclude=./.env -czf - . \
            | $SSH 'rm -rf ~/akkad-release && mkdir -p ~/akkad-release && tar -xzf - -C ~/akkad-release'
          # Optional secret GOOGLE_MAPS_API_KEY: sent over SSH and saved in /etc/akkad.env on the server.
          if [ -n "$GOOGLE_KEY" ]; then printf 'GOOGLE_MAPS_API_KEY=%s\n' "$GOOGLE_KEY" | $SSH 'umask 077; cat > ~/akkad-release/.env.deploy'; fi
          # The owner chose to replace the earlier placeholder site ("New Website", website.service).
          $SSH "sudo REPLACE_SERVICE=website PUBLIC_IP=$DEPLOY_HOST SITE_DOMAIN='$SITE_DOMAIN' bash ~/akkad-release/deploy/server-setup.sh"
      - name: Check the public address
        run: curl -fsS -o /dev/null -m 20 "http://$DEPLOY_HOST/" && echo "Live at http://$DEPLOY_HOST/"
      - name: Turn on https once it answers from outside
        run: |
          SSH="ssh -i $HOME/.ssh/lightsail.pem -o BatchMode=yes -o ConnectTimeout=20 $SSH_USER@$DEPLOY_HOST"
          D="$($SSH 'cat /etc/akkad.domain 2>/dev/null || true')"
          if [ -z "$D" ]; then echo "::warning::No https certificate yet. The site works on http, but browsers will not share location."; exit 0; fi
          if curl -fsS -o /dev/null -m 20 "https://$D/"; then
            $SSH "sudo HTTPS_VERIFIED=1 PUBLIC_IP=$DEPLOY_HOST SITE_DOMAIN='$SITE_DOMAIN' bash ~/akkad-release/deploy/server-setup.sh" | tail -3
            echo "Secure address: https://$D/"
          else
            echo "::warning::The certificate for $D is ready, but https does not answer from outside. Open port 443 (HTTPS) in the Lightsail firewall: instance > Networking > IPv4 Firewall > Add rule > HTTPS."
          fi
      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/lightsail.pem
