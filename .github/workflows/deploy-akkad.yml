name: Deploy Akkad website to Lightsail

# Runs the server tests, then copies the akkad/ folder to the Lightsail server and restarts the site.
# Needs one repository secret: LIGHTSAIL_SSH_KEY (the contents of the Lightsail .pem key file).
on:
  push:
    branches: [main, claude/wizardly-ride-hz4jv5]
    paths: ['akkad/**', '.github/workflows/deploy-akkad.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-akkad
  cancel-in-progress: false

env:
  HOST: 13.212.142.149
  SSH_USER: ubuntu

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        working-directory: akkad
        run: npm test
      - name: Prepare SSH
        env:
          KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::Add the repository secret LIGHTSAIL_SSH_KEY (Settings > Secrets and variables > Actions)."; exit 1; fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/lightsail.pem
          chmod 600 ~/.ssh/lightsail.pem
          ssh-keyscan -T 10 "$HOST" >> ~/.ssh/known_hosts
      - name: Upload and install
        run: |
          SSH="ssh -i $HOME/.ssh/lightsail.pem -o BatchMode=yes -o ConnectTimeout=20 $SSH_USER@$HOST"
          tar -C akkad --exclude=./node_modules --exclude=./data/db.json --exclude=./data/uploads -czf - . \
            | $SSH 'rm -rf ~/akkad-release && mkdir -p ~/akkad-release && tar -xzf - -C ~/akkad-release'
          $SSH 'sudo bash ~/akkad-release/deploy/server-setup.sh'
      - name: Check the public address
        run: curl -fsS -o /dev/null -m 20 "http://$HOST/" && echo "Live at http://$HOST/"
      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/lightsail.pem
